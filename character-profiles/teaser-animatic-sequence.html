<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teaser Animatic Sequence</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #040506;
      --ink: #eef2f3;
      --muted: #9ea8ae;
      --line: #293137;
      --gold: #d8bb72;
      --blue: #b9ecff;
      --red: #d4524c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 21%),
        radial-gradient(circle at 78% 22%, rgba(185,236,255,.10), transparent 24%),
        radial-gradient(circle at 24% 20%, rgba(212,82,76,.12), transparent 28%),
        #040506;
    }

    .stage-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 18px;
    }

    .stage {
      position: relative;
      width: min(100%, calc(100vh * 16 / 9 - 126px));
      max-width: 1600px;
      aspect-ratio: 16 / 9;
      background: #020304;
      border: 1px solid #1d252b;
      overflow: hidden;
      box-shadow: 0 24px 90px rgba(0,0,0,.65);
      isolation: isolate;
    }

    .courtyard,
    .rain,
    .flash,
    .shot,
    .blackout,
    .grade {
      position: absolute;
      inset: 0;
    }

    .courtyard {
      background:
        linear-gradient(90deg, rgba(12,15,17,.98), rgba(22,25,27,.76) 48%, rgba(8,10,12,.98)),
        repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,255,255,.03) 91px 92px),
        linear-gradient(180deg, #151a1d 0 48%, #080a0c 48% 100%);
    }

    .courtyard::before {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 9%;
      height: 18%;
      background:
        radial-gradient(ellipse at 35% 42%, rgba(255,255,255,.16), transparent 44%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.35));
      transform: perspective(620px) rotateX(58deg);
      filter: blur(.2px);
    }

    .rain {
      pointer-events: none;
      opacity: .62;
      background:
        repeating-linear-gradient(105deg, transparent 0 14px, rgba(202,226,235,.28) 15px 16px, transparent 17px 34px),
        repeating-linear-gradient(101deg, transparent 0 48px, rgba(202,226,235,.18) 49px 50px, transparent 51px 92px);
      background-size: 140px 220px, 220px 320px;
      animation: rainFall .42s linear infinite;
      mix-blend-mode: screen;
    }

    @keyframes rainFall {
      from { background-position: 0 0, 0 0; }
      to { background-position: -56px 220px, -88px 320px; }
    }

    .grade {
      background:
        radial-gradient(circle at 50% 42%, transparent 0 31%, rgba(0,0,0,.18) 45%, rgba(0,0,0,.76) 100%),
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.48));
      z-index: 20;
      pointer-events: none;
    }

    .flash {
      z-index: 16;
      opacity: 0;
      background:
        radial-gradient(circle at 62% 48%, rgba(255,244,204,.92), transparent 10%),
        radial-gradient(circle at 40% 18%, rgba(185,236,255,.66), transparent 28%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .stage.playing .flash {
      animation: flashCycle 8s steps(1, end) infinite;
    }

    @keyframes flashCycle {
      0%, 9%, 13%, 28%, 33%, 47%, 52%, 67%, 75%, 100% { opacity: 0; }
      10%, 29%, 48%, 68% { opacity: .78; }
      12%, 31%, 50%, 70% { opacity: .16; }
    }

    .shot {
      opacity: 0;
      z-index: 2;
      transform: scale(1);
      transition: opacity .24s ease;
    }

    .shot.active { opacity: 1; }

    .shot-a1 .goons {
      position: absolute;
      left: 11%;
      right: 11%;
      bottom: 19%;
      height: 46%;
      display: flex;
      align-items: end;
      justify-content: space-between;
      perspective: 900px;
    }

    .goon {
      position: relative;
      width: clamp(28px, 3vw, 54px);
      height: clamp(98px, 14vw, 216px);
      background: linear-gradient(90deg, #08090a, #20242a 55%, #050607);
      clip-path: polygon(36% 0, 64% 0, 76% 18%, 82% 52%, 100% 100%, 0 100%, 18% 52%, 24% 18%);
      filter: drop-shadow(0 12px 15px rgba(0,0,0,.82));
      opacity: .9;
    }

    .goon::before {
      content: "";
      position: absolute;
      top: 7%;
      left: 28%;
      width: 44%;
      height: 15%;
      border-radius: 50%;
      background:
        linear-gradient(90deg, rgba(210,57,51,.86) 0 44%, rgba(235,238,240,.42) 45% 100%),
        #121416;
      border: 1px solid rgba(255,255,255,.12);
    }

    .goon::after {
      content: "";
      position: absolute;
      right: -43%;
      top: 37%;
      width: 70%;
      height: 8%;
      background: linear-gradient(90deg, #111, #333);
      transform: rotate(-12deg);
      transform-origin: left center;
    }

    .leader {
      position: absolute;
      left: 41.6%;
      bottom: 14%;
      width: 16%;
      height: 62%;
      background:
        linear-gradient(90deg, rgba(202,134,84,.8) 0 36%, transparent 37%),
        linear-gradient(90deg, #060708, #1a1b1e 58%, #050606);
      clip-path: polygon(42% 0, 60% 0, 70% 16%, 76% 42%, 90% 100%, 10% 100%, 24% 42%, 30% 16%);
      filter: drop-shadow(0 15px 18px rgba(0,0,0,.85));
    }

    .leader::after {
      content: "";
      position: absolute;
      left: 43%;
      top: 36%;
      width: 35%;
      height: 22%;
      border: 2px solid rgba(216,187,114,.7);
      background: rgba(10,10,9,.7);
      transform: rotate(-7deg);
    }

    .shot-a2 .woman,
    .shot-a3 .woman {
      position: absolute;
      right: 4%;
      bottom: -8%;
      width: 49%;
      height: 108%;
      object-fit: cover;
      object-position: 72% 48%;
      filter: contrast(1.08) saturate(.94) brightness(.82);
      transform: scale(1.08);
    }

    .shot-a2 .woman {
      object-position: 18% 48%;
      filter: contrast(1.05) saturate(.95) brightness(.9);
    }

    .frame-insert {
      position: absolute;
      left: 12%;
      top: 22%;
      width: 35%;
      height: 45%;
      border: 7px solid #3b3120;
      background:
        linear-gradient(130deg, rgba(255,255,255,.22), transparent 34%),
        radial-gradient(circle at 42% 44%, #242220, #080909 72%);
      box-shadow: 0 16px 36px rgba(0,0,0,.62);
      transform: rotate(-5deg);
    }

    .frame-insert::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(216,187,114,.3);
    }

    .dialogue {
      position: absolute;
      left: 6%;
      bottom: 8%;
      z-index: 24;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 3.1vw, 52px);
      line-height: 1.05;
      max-width: 46%;
      color: #f1f3f5;
      text-shadow: 0 4px 18px rgba(0,0,0,.9);
      opacity: 0;
      transform: translateY(12px);
    }

    .shot.active .dialogue {
      opacity: 1;
      transform: translateY(0);
      transition: opacity .42s ease .18s, transform .42s ease .18s;
    }

    .blackout {
      z-index: 18;
      background: rgba(0,0,0,.92);
      opacity: 0;
      pointer-events: none;
    }

    .shot-a4.active ~ .blackout,
    .shot-b1.active ~ .blackout {
      opacity: .68;
    }

    .shot-b1 .knight,
    .shot-b2 .knight,
    .shot-b3 .knight {
      position: absolute;
      object-fit: contain;
      filter: contrast(1.25) brightness(.62);
    }

    .shot-b1 .knight {
      width: 33%;
      left: 8%;
      bottom: -10%;
      transform: translateX(-5%) scale(1.12);
    }

    .shot-b2 .knight {
      width: 58%;
      left: 21%;
      bottom: -26%;
      filter: contrast(1.3) brightness(.48) drop-shadow(0 0 18px rgba(185,236,255,.18));
      transform: scale(1.24);
    }

    .shot-b3 .knight {
      width: 46%;
      left: 52%;
      bottom: -15%;
      filter: contrast(1.2) brightness(.52);
      transform: translateX(-50%) scale(1.08);
    }

    .optic {
      position: absolute;
      z-index: 23;
      left: 49%;
      top: 24%;
      width: 2.9%;
      height: .9%;
      background: var(--blue);
      box-shadow: 0 0 18px 6px rgba(185,236,255,.75);
      opacity: 0;
    }

    .optic.left { transform: translateX(-135%) skewX(-14deg); }
    .optic.right { transform: translateX(32%) skewX(14deg); }

    .shot-b2.active .optic {
      opacity: 1;
      animation: opticPulse .9s ease-in-out infinite alternate;
    }

    @keyframes opticPulse {
      from { filter: brightness(.8); box-shadow: 0 0 14px 4px rgba(185,236,255,.54); }
      to { filter: brightness(1.35); box-shadow: 0 0 26px 10px rgba(185,236,255,.95); }
    }

    .muzzle {
      position: absolute;
      z-index: 22;
      width: 11%;
      height: 2%;
      background: linear-gradient(90deg, rgba(255,251,225,.98), rgba(255,194,76,.72), transparent);
      filter: blur(.5px);
      opacity: 0;
    }

    .m1 { left: 72%; top: 50%; transform: rotate(174deg); }
    .m2 { left: 11%; top: 42%; transform: rotate(8deg); }
    .m3 { left: 68%; top: 31%; transform: rotate(196deg); }

    .shot.active .muzzle {
      animation: muzzleFlash .8s steps(1, end) infinite;
    }

    .shot.active .m2 { animation-delay: .19s; }
    .shot.active .m3 { animation-delay: .36s; }

    @keyframes muzzleFlash {
      0%, 41%, 61%, 100% { opacity: 0; }
      42%, 60% { opacity: .9; }
    }

    .batarang {
      position: absolute;
      left: 48%;
      top: 68%;
      width: 10%;
      height: 4%;
      background: #050607;
      clip-path: polygon(0 52%, 28% 0, 50% 36%, 72% 0, 100% 52%, 70% 42%, 50% 100%, 30% 42%);
      filter: drop-shadow(0 0 10px rgba(185,236,255,.5));
      opacity: 0;
      z-index: 24;
    }

    .shot-b3.active .batarang {
      opacity: 1;
      animation: throwArc 2.2s cubic-bezier(.18,.7,.16,1) forwards;
    }

    @keyframes throwArc {
      from { transform: translate(-50%, 0) rotate(8deg) scale(.72); opacity: 0; }
      16% { opacity: 1; }
      to { transform: translate(28%, -470%) rotate(420deg) scale(.42); opacity: .8; }
    }

    .hud {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 12px 18px 16px;
      border-top: 1px solid #161b20;
      background: rgba(3,4,5,.88);
      backdrop-filter: blur(10px);
    }

    button {
      appearance: none;
      border: 1px solid #3d4851;
      background: #11171d;
      color: var(--ink);
      width: 44px;
      height: 36px;
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover { border-color: var(--blue); color: var(--blue); }

    .meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .beat {
      height: 6px;
      background: #202930;
      border: 0;
      width: auto;
      padding: 0;
    }

    .beat.current {
      background: linear-gradient(90deg, var(--gold), var(--blue));
      box-shadow: 0 0 14px rgba(185,236,255,.42);
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { min-height: 100dvh; }
      .stage-wrap { padding: 10px; }
      .stage { width: 100%; }
      .hud { grid-template-columns: auto 1fr; }
      .meta { grid-column: 1 / -1; }
      .dialogue { max-width: 58%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage-wrap">
      <div id="stage" class="stage playing" aria-label="Silent teaser animatic">
        <div class="courtyard"></div>

        <div class="shot shot-a1 active" data-title="A01 Procession">
          <div class="goons">
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
          </div>
          <div class="leader"></div>
        </div>

        <div class="shot shot-a2" data-title="A02 Concealed">
          <img class="woman" src="assets/heygen-arkham-widow-split-visage-v2-no-text.webp" alt="" />
          <div class="frame-insert"></div>
          <div class="dialogue">You made him<br />a symbol.</div>
        </div>

        <div class="shot shot-a3" data-title="A03 Reveal">
          <img class="woman" src="assets/heygen-arkham-widow-charred-half-reveal-v4.webp" alt="" />
          <div class="dialogue">So I made<br />one too.</div>
        </div>

        <div class="shot shot-a4" data-title="A04 Blackout">
          <div class="goons">
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
            <div class="goon"></div>
          </div>
          <div class="muzzle m1"></div>
          <div class="muzzle m2"></div>
          <div class="muzzle m3"></div>
        </div>

        <div class="shot shot-b1" data-title="B01 First Hit">
          <img class="knight" src="assets/heygen-nocturne-knight-v6-gritty-settei.webp" alt="" />
          <div class="muzzle m1"></div>
          <div class="muzzle m2"></div>
        </div>

        <div class="shot shot-b2" data-title="B02 Optics">
          <img class="knight" src="assets/heygen-nocturne-knight-v6-gritty-settei.webp" alt="" />
          <div class="optic left"></div>
          <div class="optic right"></div>
          <div class="muzzle m1"></div>
          <div class="muzzle m2"></div>
        </div>

        <div class="shot shot-b3" data-title="B03 Batarang">
          <img class="knight" src="assets/heygen-nocturne-knight-v6-gritty-settei.webp" alt="" />
          <div class="batarang"></div>
          <div class="muzzle m3"></div>
        </div>

        <div class="blackout"></div>
        <div class="flash"></div>
        <div class="rain"></div>
        <div class="grade"></div>
      </div>
    </section>

    <footer class="hud">
      <button id="toggle" type="button" aria-label="Pause">II</button>
      <div class="timeline" aria-label="Animatic timeline">
        <button class="beat current" type="button" aria-label="Procession" data-index="0"></button>
        <button class="beat" type="button" aria-label="Concealed antagonist" data-index="1"></button>
        <button class="beat" type="button" aria-label="Half reveal" data-index="2"></button>
        <button class="beat" type="button" aria-label="Blackout" data-index="3"></button>
        <button class="beat" type="button" aria-label="Optics" data-index="4"></button>
        <button class="beat" type="button" aria-label="Batarang" data-index="5"></button>
      </div>
      <div id="meta" class="meta">A01 Procession</div>
    </footer>
  </main>

  <script>
    const stage = document.querySelector("#stage");
    const shots = [...document.querySelectorAll(".shot")];
    const beats = [...document.querySelectorAll(".beat")];
    const meta = document.querySelector("#meta");
    const toggle = document.querySelector("#toggle");
    const order = [0, 1, 2, 3, 5, 6];
    const durations = [2500, 2800, 2200, 1600, 2600, 2600];
    let cursor = 0;
    let playing = true;
    let timer = 0;

    function activate(next) {
      cursor = next;
      shots.forEach((shot) => shot.classList.remove("active"));
      shots[order[cursor]].classList.add("active");
      beats.forEach((beat) => beat.classList.remove("current"));
      beats[cursor].classList.add("current");
      meta.textContent = shots[order[cursor]].dataset.title;
      window.clearTimeout(timer);
      if (playing) {
        timer = window.setTimeout(() => activate((cursor + 1) % order.length), durations[cursor]);
      }
    }

    toggle.addEventListener("click", () => {
      playing = !playing;
      stage.classList.toggle("playing", playing);
      toggle.textContent = playing ? "II" : ">";
      toggle.setAttribute("aria-label", playing ? "Pause" : "Play");
      if (playing) activate(cursor);
      else window.clearTimeout(timer);
    });

    beats.forEach((beat) => {
      beat.addEventListener("click", () => activate(Number(beat.dataset.index)));
    });

    activate(0);
  </script>
</body>
</html>
